<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="96" viewBox="0 0 96 96">
  <!-- Goldener Bilderrahmen für border-image (slice 32): Ecken mit Rosette, Kanten mit Perlenleiste.
       Jede Kante hat ihren eigenen Verlauf quer zur Leiste, damit sich die Kanten nahtlos wiederholen lassen. -->
  <defs>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="32">
      <stop offset="0" stop-color="#3d2708"/><stop offset=".07" stop-color="#a8782a"/><stop offset=".18" stop-color="#f8e7a8"/>
      <stop offset=".3" stop-color="#d6aa4c"/><stop offset=".44" stop-color="#8a5f1e"/><stop offset=".52" stop-color="#c99a3e"/>
      <stop offset=".62" stop-color="#f2d58a"/><stop offset=".74" stop-color="#b5862f"/><stop offset=".84" stop-color="#4e330b"/>
      <stop offset=".92" stop-color="#e8c977"/><stop offset="1" stop-color="#2e1d06"/>
    </linearGradient>
    <linearGradient id="b" xlink:href="#t" x1="0" y1="96" x2="0" y2="64"/>
    <linearGradient id="l" xlink:href="#t" x1="0" y1="0" x2="32" y2="0"/>
    <linearGradient id="r" xlink:href="#t" x1="96" y1="0" x2="64" y2="0"/>
    <radialGradient id="rose" cx=".4" cy=".38" r=".7">
      <stop offset="0" stop-color="#fff4c8"/><stop offset=".45" stop-color="#deb158"/><stop offset="1" stop-color="#5e3d0e"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe9ae"/><stop offset=".55" stop-color="#c8963a"/><stop offset="1" stop-color="#5a3a0c"/>
    </linearGradient>
    <g id="bead"><circle cx=".5" cy=".5" r="1.4" fill="#4a2f09"/><circle r="1.4" fill="#fff0c0"/></g>
    <g id="corner">
      <path d="M21 5C25 2 30 3 32 7C28 6 25 7 22 10Z" fill="url(#leaf)" stroke="#3d2708" stroke-width=".5"/>
      <path d="M5 21C2 25 3 30 7 32C6 28 7 25 10 22Z" fill="url(#leaf)" stroke="#3d2708" stroke-width=".5"/>
      <circle cx="13" cy="13" r="9" fill="url(#rose)" stroke="#3d2708" stroke-width=".8"/>
      <circle cx="13" cy="13" r="5.5" fill="none" stroke="#6b4612" stroke-width=".9"/>
      <circle cx="13" cy="13" r="3" fill="#7a5216"/>
      <circle cx="11.8" cy="11.6" r="1.2" fill="#fff8dd"/>
    </g>
  </defs>

  <polygon points="0,0 96,0 64,32 32,32" fill="url(#t)"/>
  <polygon points="0,96 32,64 64,64 96,96" fill="url(#b)"/>
  <polygon points="0,0 32,32 32,64 0,96" fill="url(#l)"/>
  <polygon points="96,0 96,96 64,64 64,32" fill="url(#r)"/>
  <path d="M0 0L32 32M96 0L64 32M0 96L32 64M96 96L64 64" stroke="#3d2708" stroke-width=".8" opacity=".7"/>

  <!-- Perlen: acht je Kante, Abstand 4, damit die Kante beim Wiederholen nahtlos bleibt -->
  <g id="beads-top">
    <use xlink:href="#bead" x="34" y="20"/><use xlink:href="#bead" x="38" y="20"/><use xlink:href="#bead" x="42" y="20"/><use xlink:href="#bead" x="46" y="20"/>
    <use xlink:href="#bead" x="50" y="20"/><use xlink:href="#bead" x="54" y="20"/><use xlink:href="#bead" x="58" y="20"/><use xlink:href="#bead" x="62" y="20"/>
  </g>
  <use xlink:href="#beads-top" transform="translate(0 56)"/>
  <use xlink:href="#beads-top" transform="matrix(0 1 1 0 0 0)"/>
  <use xlink:href="#beads-top" transform="matrix(0 1 1 0 56 0)"/>

  <use xlink:href="#corner"/>
  <use xlink:href="#corner" transform="translate(96 0) scale(-1 1)"/>
  <use xlink:href="#corner" transform="translate(0 96) scale(1 -1)"/>
  <use xlink:href="#corner" transform="translate(96 96) scale(-1 -1)"/>
</svg>
